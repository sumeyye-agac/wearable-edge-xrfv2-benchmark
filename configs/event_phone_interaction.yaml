seed: 42

data:
  profiles:
    earbuds_glasses: ["airpods", "imu_gl"]
    glasses_only: ["imu_gl"]
    all_imu: ["airpods", "imu_gl", "imu_lh", "imu_rh", "imu_lp", "imu_rp"]
    wifi_all: ["wifi", "airpods", "imu_gl", "imu_lh", "imu_rh", "imu_lp", "imu_rp"]
  default_profile: earbuds_glasses
  normalize_per_sample: true
  normalize_clip: 8.0

labels:
  task_variant: phone_interaction
  positive_action_names:
    - "Answer the phone"
    - "Use phone"
  proxy_keywords:
    - "head"
    - "face"
    - "phone"
    - "ear"
    - "glasses"
  positive_label_ids: []
  source_modality: "imu"

model:
  name: tiny_tcn
  num_classes: 2
  hidden_dim: 24
  kernel_size: 5

runtime:
  backend: torch
  device: auto

train:
  event_mode: flat
  epochs: 3
  lr: 0.001
  modality_dropout_p: 0.1
  background_label: 0
  hierarchical:
    energy_threshold: 1.0
    min_active_s: 0.20
    cooldown_s: 0.50
    pre_s: 0.20
    post_s: 0.40
    window_len_s: 1.50
    overlap_min_s: 0.20
    max_windows: 24
    include_gt_windows: true
  hard_negative_mining:
    enabled: false
    start_epoch: 1
    subset_samples: 256
    score_threshold: 0.6
    weight: 2.0
    max_windows_per_sample: 2
  distillation:
    enabled: false
    teacher_checkpoint: ""
    weight: 0.3
    temperature: 2.0

decode:
  mode: argmax
  score_threshold: 0.55
  min_len: 2
  nms_tiou: 0.5
  background_class: 0
  smooth_kernel: 5
  min_gap: 1

eval:
  event_mode: flat
  split: test
  frame_time_s: 0.02
  onset_tolerance_s: 0.5
  benchmark_warmup: 5
  benchmark_iters: 20
  hierarchical:
    energy_threshold: 1.0
    min_active_s: 0.20
    cooldown_s: 0.50
    pre_s: 0.20
    post_s: 0.40
    window_len_s: 1.50
    overlap_min_s: 0.20
    max_windows: 24
    include_gt_windows: false
  trigger:
    threshold: 0.55
    smoothing_window: 5
    min_active_s: 0.30
    cooldown_s: 0.75
    hysteresis: false
    threshold_off: 0.40
