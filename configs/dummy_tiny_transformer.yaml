seed: 42
model:
  name: tiny_transformer
  num_classes: 5
  hidden_dim: 32
train:
  epochs: 1
  lr: 0.01
  modality_dropout_p: 0.1
  distillation:
    enabled: false
    teacher_checkpoint: ""
    weight: 0.3
    temperature: 2.0
decode:
  score_threshold: 0.5
  min_len: 3
  nms_tiou: 0.5
eval:
  split: test
