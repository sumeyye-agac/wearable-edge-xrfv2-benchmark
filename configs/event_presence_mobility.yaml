seed: 42

data:
  profiles:
    earbuds_glasses: ["airpods", "imu_gl"]
    glasses_only: ["imu_gl"]
    all_imu: ["airpods", "imu_gl", "imu_lh", "imu_rh", "imu_lp", "imu_rp"]
    wifi_all: ["wifi", "airpods", "imu_gl", "imu_lh", "imu_rh", "imu_lp", "imu_rp"]
  default_profile: earbuds_glasses
  normalize_per_sample: true
  normalize_clip: 8.0

labels:
  task_variant: mobility_transition_presence
  positive_label_ids: [24, 26, 27]
  source_modality: "imu"

model:
  name: tiny_tcn
  num_classes: 2
  hidden_dim: 24
  kernel_size: 5

runtime:
  backend: torch
  device: auto

train:
  event_mode: hierarchical
  epochs: 3
  max_train_samples: 1024
  lr: 0.001
  modality_dropout_p: 0.1
  background_label: 0
  loss:
    focal_gamma: 2.0
    background_weight: 0.2
  hierarchical:
    energy_threshold: 1.0
    min_active_s: 0.20
    cooldown_s: 0.50
    pre_s: 0.20
    post_s: 0.40
    window_len_s: 1.50
    overlap_min_s: 0.20
    max_windows: 24
    include_gt_windows: true
    window_label_mode: pooled_max
    positive_repeat: 4
    max_negative_ratio: 3.0
  hard_negative_mining:
    enabled: false
    start_epoch: 1
    subset_samples: 256
    score_threshold: 0.6
    weight: 2.0
    max_windows_per_sample: 2

eval:
  event_mode: hierarchical
  split: test
  frame_time_s: 0.02
  onset_tolerance_s: 0.5
  max_eval_samples: 2048
  hierarchical:
    energy_threshold: 1.0
    min_active_s: 0.20
    cooldown_s: 0.50
    pre_s: 0.20
    post_s: 0.40
    window_len_s: 1.50
    overlap_min_s: 0.20
    max_windows: 24
    include_gt_windows: false
    score_mode: max
    trigger_time: peak
    score_normalization: none
  trigger:
    threshold: 0.835
    smoothing_window: 5
    min_active_s: 0.30
    cooldown_s: 0.0
    hysteresis: true
    threshold_off: 0.40

benchmark:
  seq_len: 160
  warmup: 5
  iters: 25

deployment:
  metric_mode: sample_presence
  fp_hour_budget: 10
  operating_points:
    earbuds_glasses:
      threshold: 0.835
      cooldown_s: 0.0
    glasses_only:
      threshold: 0.835
      cooldown_s: 0.0
