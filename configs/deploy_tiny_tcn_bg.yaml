seed: 42
runtime:
  backend: torch
  device: mps
data:
  modalities:
    - imu
model:
  name: tiny_tcn
  num_classes: 31
  hidden_dim: 48
  kernel_size: 7
train:
  epochs: 12
  lr: 0.004
  lr_schedule: cosine
  min_lr_ratio: 0.2
  background_label: 30
  modality_dropout_p: 0.10
  max_train_samples: 0
  max_seq_len: 0
  paper_track:
    enabled: true
    clip_len: 2048
    stride: 256
    min_segment_coverage: 0.25
    resample_to: 2048
    max_windows_per_sample: 0
    noise_std: 0.01
    scale_jitter: 0.1
  distillation:
    enabled: false
    teacher_checkpoint: ""
    weight: 0.3
    temperature: 2.0
decode:
  mode: argmax
  score_threshold: 0.20
  min_len: 3
  nms_tiou: 0.5
  background_class: 30
  smooth_kernel: 9
  min_gap: 2
eval:
  split: test
  max_eval_samples: 0
  max_seq_len: 0
  paper_track:
    enabled: true
    clip_len: 2048
    stride: 256
    min_segment_coverage: 0.25
    resample_to: 2048
benchmark:
  seq_len: 2048
  warmup: 10
  iters: 50
