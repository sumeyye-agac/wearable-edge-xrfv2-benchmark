[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xrfv2-edge-tal"
version = "0.1.0"
description = "Edge-first Temporal Action Localization benchmark for XRF V2"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "XRFV2 Edge TAL Maintainers" }]
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
  "typer>=0.12",
  "pyyaml>=6.0",
  "h5py>=3.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
xrfv2-edge-tal = "xrfv2_edge_tal.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
